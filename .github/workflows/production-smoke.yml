name: Production smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: positioncrew-production-smoke
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install monitor dependencies
        run: npm ci --ignore-scripts
      - name: Verify marketplace and all four providers
        id: verify
        continue-on-error: true
        env:
          POSITIONCREW_BASE_URL: https://positioncrew.dolepee.com
          POSITIONCREW_HEALTH_OUTPUT: /tmp/positioncrew-production-health.json
        run: npm run verify:production
      - name: Preserve timestamped health report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: positioncrew-production-health-${{ github.run_id }}
          path: /tmp/positioncrew-production-health.json
          if-no-files-found: error
          retention-days: 30
      - name: Record scheduled outcome
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          git fetch origin production-monitor:refs/remotes/origin/production-monitor
          git show origin/production-monitor:evidence/production-track-record.json > /tmp/current-production-track-record.json
          npx tsx scripts/update-production-track-record.ts /tmp/current-production-track-record.json /tmp/next-production-track-record.json
          git config user.name "positioncrew-monitor[bot]"
          git config user.email "positioncrew-monitor[bot]@users.noreply.github.com"
          git checkout -B production-monitor origin/production-monitor
          cp /tmp/next-production-track-record.json evidence/production-track-record.json
          git add evidence/production-track-record.json
          if git diff --cached --quiet; then
            echo "Scheduled run ${GITHUB_RUN_ID} is already recorded."
          else
            git commit -m "Record production run ${GITHUB_RUN_ID}"
            git push origin HEAD:production-monitor
          fi
      - name: Enforce production verification
        if: always()
        env:
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: test "$VERIFY_OUTCOME" = "success"
