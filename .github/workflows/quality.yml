name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: positioncrew-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify committed evidence
        run: |
          npm run benchmark:verify-lock
          npm run benchmark:verify-captures
          npm run benchmark:verify-marketplace-protocol
          npm run benchmark:verify-marketplace
      - name: Typecheck and unit tests
        run: |
          npm run typecheck
          npm test
      - name: Build production bundle
        run: npm run build
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Browser workflows
        run: |
          npx wrangler dev --config dist/server/wrangler.json --port 4175 >/tmp/positioncrew-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4175/ >/dev/null; then
              break
            fi
            if ! kill -0 "$preview_pid" 2>/dev/null; then
              cat /tmp/positioncrew-preview.log
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4175/ >/dev/null
          PLAYWRIGHT_BASE_URL=http://127.0.0.1:4175 npm run test:e2e
